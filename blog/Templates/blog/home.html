
<!DOCTYPE html>
<html lang="en">
<head>
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Django Blog</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f4f6f8;
            color: #222;
            line-height: 1.6;
        }

        h1 {
            color: #1769aa;
        }

        article {
            background-color: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px #00000010;
        }

        article h3 {
            margin-top: 0;
        }

        small {
            color: #666;
        }
    </style>
</head>

</head>
<body>
    <h1>Welcome to My Django Blog!</h1>
    <p>This is my first Django blog homepage.</p>

    <hr>

    <h2>Latest Blog Posts</h2>

    {% for post in posts %}
        <article>
            
<h3>
    <a href="{% url 'post_detail' post.id %}">
        {{ post.title }}
    </a>
</h3>

            <p>By {{ post.author }}</p>
            <p>{{ post.content }}</p>
            <small>Created: {{ post.created_at }}</small>
        </article>
        <hr>
    {% empty %}
        <p>No blog posts have been published yet.</p>
    {% endfor %}

</body>
</html>
